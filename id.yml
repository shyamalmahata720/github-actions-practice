name: id-example

on:
  workflow-dispatch

jobs:
  demo:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x.x"

      - name: Greeting
        id: info
        run: echo "greeting=Hello from Shyam" >> "$GITHUB_OUTPUT"

      - name: Print
        if: github.ref == 'refs/heads/main'
        run: echo "${{steps.info.outputs.greeting}}"
